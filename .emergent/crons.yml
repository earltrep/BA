crons:
  - name: autopilot-monthly
    description: "Adds recurring bills & paychecks for the new month for autopilot-enabled users"
    cron: "0 6 1 * *"
    endpoint: "{{BASE_URL}}/api/cron/autopilot"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
